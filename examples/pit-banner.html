<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Matrix · Pit banner example</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/team-matrix.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; }
body { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
.banner { width: min(100%, 1200px); aspect-ratio: 4 / 1; background: var(--tm-gradient-brand); border-radius: var(--tm-radius-md); padding: 3% 4%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4%; align-items: center; }
.banner .tm-display { font-size: clamp(2rem, 6vw, 5rem); text-align: right; }
@media (max-width: 720px) { .banner { aspect-ratio: auto; grid-template-columns: 1fr; } .banner .tm-display { text-align: left; } }
</style>
</head>
<body class="tm-page">
<div class="banner">
  <img class="tm-logo" src="../assets/logo/team-matrix-logo-white-trimmed.png" alt="Team Matrix #20870" style="width:min(30vw,300px)">
  <div style="display:grid;gap:8px"><h1 class="tm-display">Team Matrix · 20870</h1><span class="tm-label" style="color:var(--tm-text-heading);text-align:right"><i>FIRST</i>® Tech Challenge · Mumbai</span></div>
</div>
</body>
</html>
